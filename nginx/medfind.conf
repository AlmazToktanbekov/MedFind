# Конфиг сайта для ХОСТОВОГО nginx (сервер с несколькими проектами).
# Скопировать в /etc/nginx/sites-available/medfind.softjol.site, заменить домен при необходимости,
# затем: ln -s в sites-enabled, nginx -t, systemctl reload nginx, certbot --nginx -d <домен>.

server {
    listen 80;
    server_name medfind.softjol.site;

    client_max_body_size 20M;

    # Загруженные фото — отдаём напрямую с диска (bind-mount из docker-compose: ./backend/uploads)
    location /uploads/ {
        alias /srv/MedFind/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Всё остальное — в бэкенд-контейнер
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
