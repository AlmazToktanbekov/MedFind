name: medfind
description: "MedFind — медицинское приложение Кыргызстана"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Архитектура
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Навигация
  go_router: ^14.8.1

  # HTTP
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0

  # Хранение токенов
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # UI
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Утилиты
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.0
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
