# Вариант для сервера с НЕСКОЛЬКИМИ проектами:
# на хосте уже стоит nginx (или apache) — он и работает реверс-прокси + TLS.
# Этот compose поднимает только БД и бэкенд; бэкенд доступен на 127.0.0.1:8010
# (8000 на хосте занят другим проектом).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medfind_db}
      POSTGRES_USER: ${POSTGRES_USER:-medfind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medfind_user} -d ${POSTGRES_DB:-medfind_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:8010:8000"   # доступен только локально — наружу проксирует хостовый nginx
    volumes:
      - ./backend/uploads:/app/uploads   # bind-mount: хостовый nginx раздаёт /uploads/ из этой папки
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
